# Track 2: dual-hart PicoRV32 campaigns (harness/dual_campaign.py): soundness, L4 bug detection + replay study,
# and minimisation with free vs forced data order. Artifact "dual-hart": logs/dual/*.json and the console log.
# Manual trigger only; no secrets.
name: Dual-hart campaigns

on:
  workflow_dispatch:
    inputs:
      pairs: {description: "random program pairs (soundness and bug search)", required: true, default: "500"}
      replays: {description: "memory timings per replay test", required: true, default: "16"}
      budget: {description: "ddmin tests per bug and mode", required: true, default: "300"}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/encarsia-env:${{ hashFiles('docker/encarsia/Dockerfile') }}" >> "$GITHUB_OUTPUT"
      - name: Build the toolchain image if this version does not exist yet
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then exit 0; fi
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                       -t "${{ steps.tag.outputs.image }}" docker/encarsia
          docker push "${{ steps.tag.outputs.image }}"

  dual:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: {contents: read, packages: read}
    container:
      image: ${{ needs.image.outputs.image }}
      credentials: {username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
    steps:
      - uses: actions/checkout@v4
      - name: Soundness, bugs, minimise
        run: |
          set -o pipefail
          mkdir -p logs/dual
          { python3 -m harness.dual_campaign soundness --pairs ${{ inputs.pairs }} --max-cycles 100000
            python3 -m harness.dual_campaign bugs --pairs ${{ inputs.pairs }} --replays ${{ inputs.replays }} --max-cycles 100000
            python3 -m harness.dual_campaign minimise --replays ${{ inputs.replays }} --budget ${{ inputs.budget }} --max-cycles 100000
          } 2>&1 | tee logs/dual/console.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dual-hart, path: logs/dual}
